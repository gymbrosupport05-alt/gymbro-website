<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GYMBRO - Product Reviews</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #000;
            color: #fff;
            line-height: 1.6;
        }

        .wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px 24px;
            /* moved further up to cover the gap */

        }


        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        p.sub {
            color: #ccc;
            margin-bottom: 24px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 18px;
            backdrop-filter: blur(10px);
        }

        .row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        label {
            color: #ccc;
            font-size: 0.95rem;
        }

        select,
        input[type="number"],
        input[type="text"],
        textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            border-radius: 12px;
            padding: 12px 14px;
            margin-top: 8px;
            outline: none;
            font-family: inherit;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
        }

        select {
            /* helps some browsers keep a white background; force dark text */
            background-color: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        select option {
            background: #111;
            color: #fff;
        }



        textarea {
            min-height: 170px;
            /* increase height of review input */
            resize: vertical;
        }


        .grid2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 800px) {
            .grid2 {
                grid-template-columns: 1fr;
            }
        }

        .btn {
            border: none;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            background: #ff4757;
            color: #fff;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            background: #ff3748;
        }

        .reviews-list {
            margin-top: 18px;
            display: grid;
            gap: 12px;
        }

        .review {
            padding: 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
        }

        .review-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
        }

        .stars {
            color: #ffd166;
            font-size: 0.95rem;
        }

        .who {
            color: #ccc;
            font-size: 0.95rem;
        }

        .review p {
            color: #eee;
        }

        .ts {
            color: #777;
            font-size: 0.9rem;
            margin-top: 6px;
        }

        .empty {
            color: #aaa;
            font-style: italic;
            padding: 18px 6px;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <h1>Write a Review</h1>
        <p class="sub">Rate the products and leave a short review. (Saved in your browser via localStorage.)</p>

        <div class="card">
            <form id="reviewForm">
                <div class="grid2">
                    <div>
                        <label for="productSelect">Product</label>
                        <select id="productSelect" required>
                            <option value="" disabled selected>Select a product</option>
                            <option>Gym Bro Hoodie</option>
                            <option>Sleeveless Tank Tee</option>
                            <option>Siren Crop Tee</option>
                            <option>Beast Track Pants</option>
                            <option>Pro Lift Gloves</option>
                            <option>Warrior Leggings</option>
                            <option>Lifting Straps</option>
                            <option>Deadlift Belt</option>
                            <option>Muscle Blaze Shaker</option>
                            <option>Gym Towel</option>
                            <option>MuscleBlaze Gym Bag</option>
                        </select>
                    </div>

                    <div>
                        <label for="rating">Rating (1-5)</label>
                        <input type="number" id="rating" min="1" max="5" step="1" value="5" required />
                    </div>
                </div>

                <div style="margin-top: 14px;">
                    <label for="customerName">Your name</label>
                    <input type="text" id="customerName" placeholder="e.g., Alex" required />
                </div>

                <div style="margin-top: 14px;">
                    <label for="reviewText">Write your review</label>
                    <textarea id="reviewText" placeholder="What did you like?" required></textarea>
                </div>

                <div class="row" style="margin-top: 14px;">
                    <button class="btn" type="submit">Submit Review</button>
                    <button class="btn" type="button" style="background:#222;border:1px solid rgba(255,255,255,0.15)"
                        onclick="loadReviews()">
                        Refresh List
                    </button>
                </div>
            </form>
        </div>

        <div class="card" style="margin-top: 18px;">
            <div class="row" style="justify-content: space-between;">
                <div>
                    <h2 style="font-size:1.4rem; margin-bottom: 6px;">Recent Reviews</h2>
                    <p class="sub" style="margin:0;">Reviews are grouped by product.</p>
                </div>
            </div>

            <div id="reviewsList" class="reviews-list"></div>
        </div>
    </div>

    <script>
        const REVIEWS_KEY = 'gymbroReviews';

        function getAllReviews() {
            return JSON.parse(localStorage.getItem(REVIEWS_KEY)) || [];
        }

        function escapeHtml(str) {
            return String(str)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '<')
                .replaceAll('>', '>')
                .replaceAll('"', '"')
                .replaceAll("'", '&#039;');
        }

        function starsHtml(rating) {
            const r = Math.max(0, Math.min(5, Number(rating) || 0));
            const full = '★'.repeat(r);
            const empty = '☆'.repeat(5 - r);
            return full + empty;
        }

        function deleteReview(reviewId) {
            const confirmed = confirm('Delete this review?');
            if (!confirmed) return;

            const reviews = getAllReviews().filter(r => r.id !== reviewId);
            localStorage.setItem(REVIEWS_KEY, JSON.stringify(reviews));
            loadReviews();
        }

        function loadReviews() {
            const list = document.getElementById('reviewsList');
            const reviews = getAllReviews();


            if (!reviews.length) {
                list.innerHTML = '<div class="empty">No reviews yet. Be the first!</div>';
                return;
            }

            // Group by product
            const byProduct = reviews.reduce((acc, rv) => {
                const key = rv.product || 'Unknown';
                acc[key] = acc[key] || [];
                acc[key].push(rv);
                return acc;
            }, {});

            const productNames = Object.keys(byProduct).sort();

            list.innerHTML = productNames.map(product => {
                const group = byProduct[product].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                const avg = group.reduce((s, x) => s + (Number(x.rating) || 0), 0) / group.length;
                const avgRounded = Math.round(avg * 10) / 10;

                return `
          <div class="review" style="background: rgba(255,71,87,0.06); border-color: rgba(255,71,87,0.25);">
            <div class="review-head">
              <div>
                <div style="font-weight:800;">${escapeHtml(product)}</div>
                <div class="who">Average: ${avgRounded} / 5</div>
              </div>
              <div class="stars" title="Average rating">${starsHtml(Math.round(avg))}</div>
            </div>

            <div class="reviews-list" style="margin-top: 10px;">
              ${group.slice(0, 5).map(rv => {
                    return `
                  <div class="review" style="margin: 8px 0; background: rgba(255,255,255,0.02)">
                    <div class="review-head">
                      <div class="who">${escapeHtml(rv.name || 'Customer')}</div>
                      <div class="stars">${starsHtml(rv.rating)}</div>
                    </div>
                    <p>${escapeHtml(rv.text || '')}</p>
                    <div class="ts">${new Date(rv.createdAt).toLocaleString('en-IN')}</div>
                    <div style="margin-top: 10px; display:flex; justify-content:flex-end;">
                      <button type="button" class="btn" style="background:#2b2b2b; border:1px solid rgba(255,255,255,0.15)" onclick="deleteReview('${rv.id}')">Delete</button>
                    </div>
                  </div>

                `;
                }).join('')}
            </div>
          </div>
        `;
            }).join('');
        }

        document.getElementById('reviewForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const product = document.getElementById('productSelect').value;
            const rating = Number(document.getElementById('rating').value);
            const name = document.getElementById('customerName').value.trim();
            const text = document.getElementById('reviewText').value.trim();

            if (!product || !name || !text) return;
            if (!(rating >= 1 && rating <= 5)) {
                alert('Rating must be between 1 and 5');
                return;
            }

            const reviews = getAllReviews();
            reviews.push({
                id: 'REV-' + Date.now(),
                product,
                rating,
                name,
                text,
                createdAt: new Date().toISOString()
            });
            localStorage.setItem(REVIEWS_KEY, JSON.stringify(reviews));

            e.target.reset();
            document.getElementById('rating').value = 5;
            loadReviews();
            alert('Review submitted!');
        });

        // initial load
        loadReviews();
    </script>
</body>

</html>
